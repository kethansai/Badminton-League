<!doctype html>
<html lang="en" class="is-booting">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1a24" />
    <meta name="description" content="ABPL is the first-ever professional, city-based franchise league for badminton in the United States. Coming soon." />
    <title>American Badminton Premier League &mdash; Badminton Built for America</title>
    <style>
      #boot-loader { position: fixed; inset: 0; z-index: 2000; display: grid; place-content: center; justify-items: center; gap: 1.6rem; background: #090f14; color: #ede6de; font: 500 0.78rem/1.4 'Segoe UI', system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.14em; transition: opacity 0.55s ease, visibility 0s linear 0.55s; }
      #boot-loader[data-state='done'] { opacity: 0; visibility: hidden; pointer-events: none; }
      #boot-loader[data-state='done'] .boot-mark { transform: scale(1.06); }
      .boot-mark { position: relative; display: grid; place-items: center; width: 132px; height: 132px; transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1); }
      .boot-orbit { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgb(237 230 222 / 0.1); border-top-color: #d4af61; animation: bootOrbit 1.1s linear infinite; }
      .boot-shuttle { width: 60px; height: 90px; animation: bootSpin 1.6s cubic-bezier(0.6, 0, 0.4, 1) infinite; }
      .boot-bar { position: relative; width: 168px; height: 2px; overflow: hidden; background: rgb(237 230 222 / 0.14); }
      .boot-bar::after { content: ''; position: absolute; inset: 0; background: #d4af61; transform: scaleX(var(--boot-progress, 0.08)); transform-origin: 0 50%; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
      .boot-label { margin: 0; }
      .boot-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      @keyframes bootSpin { to { transform: rotate(360deg); } }
      @keyframes bootOrbit { to { transform: rotate(-360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-orbit, .boot-shuttle { animation: none; }
        #boot-loader, .boot-mark, .boot-bar::after { transition: none; }
      }
    </style>
    <noscript><style>#boot-loader { display: none; }</style></noscript>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite" aria-busy="true">
      <div class="boot-mark" aria-hidden="true">
        <span class="boot-orbit"></span>
        <svg class="boot-shuttle" viewBox="0 0 80 120" fill="none">
          <path d="M10 14 Q16 7 22 14 Q28 7 34 14 Q40 7 46 14 Q52 7 58 14 Q64 7 70 14 L50 80 H30 Z" fill="rgb(247 243 236 / 0.12)" stroke="#f7f3ec" stroke-width="2" stroke-linejoin="round" />
          <path d="M32 80 L17 14 M36 80 L29 12 M40 80 V11 M44 80 L51 12 M48 80 L63 14" stroke="rgb(247 243 236 / 0.55)" stroke-width="1.2" stroke-linecap="round" />
          <path d="M18 38 Q40 44 62 38 M25 60 Q40 65 55 60" stroke="#d4af61" stroke-width="2" stroke-linecap="round" />
          <path d="M28 80 H52 V87 A12 12 0 0 1 28 87 Z" fill="#d4af61" />
          <path d="M28 85 H52" stroke="#b8913a" stroke-width="1.5" />
        </svg>
      </div>
      <p class="boot-label"><span class="boot-sr">American Badminton Premier League. </span>Loading the court</p>
      <div class="boot-bar" aria-hidden="true"></div>
    </div>
    <div id="app" inert></div>
    <noscript>This site requires JavaScript. Please enable it to view the American Badminton Premier League.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
